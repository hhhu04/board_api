name: Build and Push Docker Image

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=dev


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DBHOST=${{ secrets.DBHOST }}
            DBPORT=${{ secrets.DBPORT }}
            DB=${{ secrets.DB }}
            USERNAME=${{ secrets.USERNAME }}
            DBPASSWORD=${{ secrets.PASSWORD }}
            JWTSECRET=${{ secrets.SECRET }}
            JWTISSUER=${{ secrets.ISSUER }}
            DNF=${{ secrets.DNF }}
            CYPHERS=${{ secrets.CYPHERS }}

      - name: Get existing container ID
        id: get_container
        run: |
          CONTAINER_NAME="${{ github.event.repository.name }}"
          CONTAINER_ID=$(curl -s "${{ secrets.PORTAINERURL }}/api/endpoints/${{ secrets.PORTAINER_ENV_NO }}/docker/containers/json?all=true" \
            -H "X-API-KEY: ${{ secrets.PORTAINERTOKEN }}"  \
            -r ".[] | select(.Names[] == \"/$CONTAINER_NAME\") | .Id")
          echo "container_id=$CONTAINER_ID" >> $GITHUB_OUTPUT
          echo "container_name=$CONTAINER_NAME" >> $GITHUB_OUTPUT
          echo "Found container ID: $CONTAINER_ID"

      - name: Delete existing container
        if: steps.get_container.outputs.container_id != 'null' && steps.get_container.outputs.container_id != ''
        run: |
          echo "Deleting existing container..."
          curl -s -X DELETE "${{ secrets.PORTAINERURL }}/api/endpoints/${{ secrets.PORTAINER_ENV_NO }}/docker/containers/${{ steps.get_container.outputs.container_id }}?force=true" \
            -H "X-API-KEY: ${{ secrets.PORTAINERTOKEN }}"

      - name: Pull latest image (with error handling)
        run: |
          echo "Pulling latest image..."
          
          RESPONSE=$(curl -s -w "%{http_code}" \
            -X POST "${{ secrets.PORTAINERURL }}/api/endpoints/${{ secrets.PORTAINER_ENV_NO }}/docker/images/create" \
            -H "X-API-KEY: ${{ secrets.PORTAINERTOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"fromImage\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\"}")
          
          HTTP_CODE=${RESPONSE: -3}
          BODY=${RESPONSE%???}
          
          echo "HTTP Code: $HTTP_CODE"
          echo "Response: $BODY"
          
          if [ $HTTP_CODE -ge 400 ]; then
            echo "❌ Failed to pull image"
            exit 1
          else
            echo "✅ Image pull initiated"
          fi

      - name: Create new container
        run: |
          echo "Creating new container with image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev"
          curl -s -X POST "${{ secrets.PORTAINERURL }}/api/endpoints/${{ secrets.PORTAINER_ENV_NO }}/docker/containers/create?name=${{ steps.get_container.outputs.container_name }}" \
            -H "X-API-KEY: ${{ secrets.PORTAINERTOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"Image\": \"${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev\",
              \"HostConfig\": {
                \"NetworkMode\": \"local\",
                \"PortBindings\": {
                  \"8081/tcp\": [{\"HostPort\": \"8081\"}]
                }
                \"RestartPolicy\": {
                  \"Name\": \"unless-stopped\"
                }
              }
            }"

      - name: Start container
        run: |
          echo "Starting container..."
          curl -s -X POST "${{ secrets.PORTAINERURL }}/api/endpoints/${{ secrets.PORTAINER_ENV_NO }}/docker/containers/${{ steps.get_container.outputs.container_name }}/start" \
            -H "X-API-KEY: ${{ secrets.PORTAINERTOKEN }}"
          echo "✅ Deployment completed!"